# Generated by scripts/build-bundles.mjs. Relative module paths resolve from the bundle package.
- insert:
    - id: independent-chief
      name: dsh-workbench-suite
    - id: workbench-browser
      name: dsh-workbench-suite/browser
    - id: workbench-desktop
      name: dsh-workbench-suite/desktop
    - id: workbench-git
      name: dsh-workbench-suite/git
    - id: chatgpt
      disabled: true
      name: 'dsh-plugin-chatgpt'
      config:
        provider: chatgpt
        displayName: ChatGPT
        stateDir: !!js (process.env.DSH_HOME ?? process.env.HOME + '/.dsh') + '/chatgpt-subscription'
        proxyUrl: !!js process.env.DSH_CHATGPT_PROXY_URL ?? ''

# No default model is set here. A model id is account-specific — the entitlement
# differs per plan and account — so a hard-coded default would silently be wrong
# for most installs. Pick one from the account's own list after signing in, using
# the Models page or `GET /v1/models`.
